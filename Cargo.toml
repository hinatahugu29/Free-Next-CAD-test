[workspace]
resolver = "3"
members = [
    "crates/cad-occt",
    "crates/cad-geometry",
    "crates/cad-core",
    "crates/cad-render",
    "crates/cad-ui",
    "crates/cad-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["FerroCAD Contributors"]

[workspace.dependencies]
cxx = "1.0"
cxx-build = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
glam = { version = "0.29", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
bytemuck = { version = "1.20", features = ["derive"] }
wgpu = "24.0"
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
eframe = "0.31"
egui = "0.31"
rfd = "0.15"

cad-occt = { path = "crates/cad-occt" }
cad-geometry = { path = "crates/cad-geometry" }
cad-core = { path = "crates/cad-core" }
cad-render = { path = "crates/cad-render" }
cad-ui = { path = "crates/cad-ui" }
